:root {
  --bg: #F6F5F1;
  --panel: #FFFFFF;
  --ink: #1F1F1C;
  --muted: #66645D;
  --line: #D6D3CA;
  --soft: #EEECE6;
  --accent: #2F5FD0;

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 12px 24px; max-width: 1400px; margin: 0 auto; }
.brand { font-weight: 700; font-size: 16px; margin-right: auto; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 8px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { padding: 8px 14px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; }
nav button[aria-current="page"] { background: var(--ink); color: #FFF; border-color: var(--ink); }
.teampick { display: flex; align-items: center; gap: 8px; }
select, input[type="text"] { padding: 8px 10px; border: 1px solid #B9B6AC; border-radius: 6px; background: #FFF; }
input[type="text"]:disabled { background: var(--soft); color: var(--muted); }

main { max-width: 1400px; margin: 0 auto; padding: 20px 24px 48px; }
.banner { margin-bottom: 16px; padding: 10px 14px; border-radius: 6px; background: #FFF4D6; border: 1px solid #E6CF85; }
.banner.err { background: #FBE7E4; border-color: #E2A59D; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
h2 { font-size: 16px; margin: 0 0 12px; }
h3 { font-size: 13px; margin: 0; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.btn { padding: 9px 14px; border: 1px solid var(--ink); background: var(--panel); border-radius: 6px; }
.btn.primary { background: var(--ink); color: #FFF; }
.btn.ghost { border-color: var(--line); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkbtn { border: 0; background: none; padding: 2px 4px; color: var(--accent); text-decoration: underline; }
.linkbtn.danger { color: var(--danger); }

.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: start; }

.opts { display: flex; flex-wrap: wrap; gap: 6px 16px; }

.place { border: 1px solid var(--line); background: var(--soft); border-radius: 6px; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }

.formbtns { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; }

.eltable .actm { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); border-bottom: 2px solid var(--ink); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.group td { background: var(--soft); font-weight: 600; font-size: 12px; letter-spacing: .03em; color: var(--muted); }
tr.cont td { border-top: 0; }
td.code { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar-cell span { display: block; height: 10px; background: var(--ink); border-radius: 2px; }

.maps { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }

.mapcard .head { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.mapcard svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; }
.node { cursor: grab; }
.rlab { cursor: pointer; }
.rlab:hover line:last-of-type { stroke: #2F5FD0; }
.node:active { cursor: grabbing; }
.outside { margin-top: 14px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 8px; background: var(--soft); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; color: var(--muted); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.maplayout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }

.side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 80px; }
.sel { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
.sel b { font-weight: 600; }
.rellist { display: flex; flex-direction: column; }
.rel { display: flex; gap: 8px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); }
.rel .n { width: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.rel .t { flex: 1; min-width: 0; }

.maptools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; margin-bottom: 12px; }
.hint { color: var(--muted); }
.hint.on { color: var(--accent); font-weight: 600; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 38px; height: 22px; border-radius: 11px; background: #C9C6BD; position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #FFF; transition: transform .15s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(31,31,28,.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
.pop { background: var(--panel); border-radius: 10px; padding: 20px; width: min(420px, 100%); box-shadow: 0 10px 40px rgba(0,0,0,.2); }
.pair { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 14px; padding: 10px 12px; background: var(--soft); border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { .switch .track, .switch .track::after { transition: none; } }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
.kv b { font-variant-numeric: tabular-nums; text-align: right; }
.listed { display: flex; flex-direction: column; gap: 8px; }
.listed .item { display: flex; gap: 8px; align-items: center; }
.listed .item input { flex: 1; min-width: 0; }
.tag { display: inline-block; padding: 1px 6px; border: 1px solid #B9B6AC; border-radius: 4px; font-size: 12px; font-weight: 700; }
.confirm { display: inline-flex; gap: 6px; align-items: center; }
nav { align-items: flex-end; gap: 10px; }
@media (max-width: 700px) { header { position: static; } .bar { padding: 12px 16px; } main { padding: 16px 16px 40px; } }
.stage { display: flex; flex-direction: column; gap: 3px; }

.cmaps { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; margin-bottom: 20px; }

.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }

.ctl { display: flex; flex-direction: column; gap: 4px; min-width: 0; }

textarea { font: inherit; color: inherit; padding: 8px 10px; border: 1px solid #B9B6AC; border-radius: 6px; background: #FFF; width: 100%; resize: vertical; }
.ivshow { padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--soft); line-height: 1.45; }
.ratelist { display: flex; flex-direction: column; gap: 10px; }
.rate { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }

.rate .top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.rate .top b { font-weight: 600; }

.rate .row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 150px); gap: 8px; }

.vol { display: flex; align-items: center; gap: 10px; }
.vol input { width: 200px; max-width: 50vw; accent-color: var(--accent); }
.vol b { font-variant-numeric: tabular-nums; }
.mgrid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1000px) { .mgrid { grid-template-columns: minmax(0, 1fr); } }
.plot svg { display: block; width: 100%; height: auto; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.pill.crit { border-color: #C8571E; color: #C8571E; }
.pill.struct { border-color: var(--accent); color: var(--accent); }
.pill.vul { border-color: #1E8556; color: #1E8556; }
.unrated { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pill.pA { border-color: #1E8556; color: #1E8556; }
.pill.pB { border-color: var(--accent); color: var(--accent); }
.pill.pC { border-color: #7A4FB5; color: #7A4FB5; }
.pill.pE { border-color: #C8571E; color: #C8571E; }
.pill.pD { border-style: dashed; }
.pill.pQ { border-style: dotted; }
.cell { display: block; height: 22px; border-radius: 3px; background: #F8F7F3; border: 1px solid var(--line); }
.cell.on { background: var(--muted); border-color: var(--muted); }
.cell.disp { background: repeating-linear-gradient(45deg, var(--muted) 0 3px, #F8F7F3 3px 6px); border-color: var(--muted); }
.cell.self { background: transparent; border: 1px dashed var(--line); }
.vh { writing-mode: vertical-rl; transform: rotate(180deg); height: 132px; font-size: 11px; color: var(--muted); white-space: nowrap; font-weight: 400; overflow: hidden; text-overflow: ellipsis; }
.rec { width: auto; }
.rec th, .rec td { padding: 3px; }
.ck { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; margin: 3px 4px 0 0; cursor: pointer; }
.ck input { margin: 0; }
.warn { color: #C8571E; font-size: 12px; }
.ftable td { vertical-align: top; }
.ftable select { min-width: 140px; }
.grid2b { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; margin-top: 20px; }
@media (max-width: 900px) { .grid2b { grid-template-columns: minmax(0, 1fr); } }
.empty { padding: 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }
</style>
</head>

async function makeFirebaseStore() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const { initializeApp } = await import(base + "firebase-app.js");
  const fs = await import(base + "firebase-firestore.js");
  const app = initializeApp(firebaseConfig);
  const db = fs.getFirestore(app);
  const wRef = fs.doc(db, "workshops", WID);
  const eCol = fs.collection(db, "workshops", WID, "elements");
  const rCol = fs.collection(db, "workshops", WID, "relations");
  const state = { workshop: null, elements: [], relations: [] };
  let ready = { w: false, e: false, r: false };
  const onErr = (e) => { console.error(e); showBanner("Could not reach the database. Check the internet connection and the Firestore rules, then reload. (" + esc(e.code || e.message) + ")", true); };
  return {
    subscribe(cb) {
      const fire = () => { if (ready.w && ready.e && ready.r) cb({ ...state }); };
      fs.onSnapshot(wRef, (snap) => {
        if (!snap.exists()) { fs.setDoc(wRef, DEFAULT_WORKSHOP).catch(onErr); return; }
        state.workshop = snap.data(); ready.w = true; fire();
      }, onErr);
      fs.onSnapshot(eCol, (snap) => { state.elements = snap.docs.map((d) => ({ id: d.id, ...d.data() })); ready.e = true; fire(); }, onErr);
      fs.onSnapshot(rCol, (snap) => { state.relations = snap.docs.map((d) => ({ id: d.id, ...d.data() })); ready.r = true; fire(); }, onErr);
    },
    saveWorkshop(w) { return fs.setDoc(wRef, w).catch(onErr); },
    async addElement(d) { const ref = await fs.addDoc(eCol, { ...d, createdAt: fs.serverTimestamp() }).catch(onErr); return ref?.id; },
    updateElement(id, d) { return fs.updateDoc(fs.doc(eCol, id), d).catch(onErr); },
    setPosition(id, aid, x, y) { return fs.updateDoc(fs.doc(eCol, id), new fs.FieldPath("placements", aid, "x"), x, new fs.FieldPath("placements", aid, "y"), y).catch(onErr); },
    deleteDocs(elementIds, relationIds) {
      const b = fs.writeBatch(db);
      elementIds.forEach((i) => b.delete(fs.doc(eCol, i)));
      relationIds.forEach((i) => b.delete(fs.doc(rCol, i)));
      return b.commit().catch(onErr);
    },
    addRelation(d) { return fs.addDoc(rCol, { ...d, createdAt: fs.serverTimestamp() }).catch(onErr); },
    updateRelation(id, d) { return fs.updateDoc(fs.doc(rCol, id), d).catch(onErr); },
    setVul(id, aid, v) { return fs.updateDoc(fs.doc(eCol, id), new fs.FieldPath("placements", aid, "vul"), v).catch(onErr); },
    setIntervention(tid, v) { return fs.updateDoc(wRef, new fs.FieldPath("interventions", tid), v).catch(onErr); },
    setPlace(id, aid, f, v) { return fs.updateDoc(fs.doc(eCol, id), new fs.FieldPath("placements", aid, f), v).catch(onErr); }
  };
}

  const placements = {};

    if (p.voice === "spoken" && !p.spokenBy.trim()) return msg("Write who speaks for it in " + (asmById(aid)?.name || "") + ".");
    if (p.voice !== "spoken") p.spokenBy = "";
    if (p.source !== "__other") p.sourceOther = "";
    placements[aid] = p;
  }
  if (f.editId) {
    const old = elById(f.editId);
    for (const aid of checked) { const op = old?.placements?.[aid]; if (op && typeof op.x === "number") { placements[aid].x = op.x; placements[aid].y = op.y; } }
    const removed = Object.keys(old?.placements || {}).filter((a) => !checked.includes(a));
    const dropRel = data.relations.filter((r) => removed.includes(r.assemblage) && (r.from === f.editId || r.to === f.editId)).map((r) => r.id);
    await store.updateElement(f.editId, { name, placements });
    if (dropRel.length) await store.deleteDocs([], dropRel);
  } else {
    const no = 1 + Math.max(0, ...data.elements.filter((e) => e.team === team && e.type === f.type).map((e) => e.no || 0));
    await store.addElement({ team, type: f.type, no, name, placements });
  }
  const keepType = f.type;
  form = newForm(); form.type = keepType;
  renderForm(); $("#fName")?.focus();
}

const VB_W = 600, VB_H = 480, S = 34;
function ringSlots(n) {
  // evenly spaced points on a circle, starting at the top; a second inner ring when crowded
  const outer = Math.min(n, 14), inner = n - outer, slots = [];
  for (let i = 0; i < outer; i++) { const t = -Math.PI / 2 + (2 * Math.PI * i) / outer; slots.push([0.5 + 0.38 * Math.cos(t), 0.47 + 0.37 * Math.sin(t)]); }
  for (let i = 0; i < inner; i++) { const t = -Math.PI / 2 + Math.PI / inner + (2 * Math.PI * i) / inner; slots.push([0.5 + 0.19 * Math.cos(t), 0.47 + 0.18 * Math.sin(t)]); }
  return slots;
}
function layoutDefaults(list) {
  // elements nobody has moved yet sit on a circle, so any two can be joined without crossing the others

  return onMap.map((e) => ({ e, p: e.placements[aid], r: resOf(e, aid), d: deg[e.id + "|" + aid] || 0, n: onMap.length, c: normDeg(deg[e.id + "|" + aid] || 0, onMap.length) }));
}
const As = (aid) => withDeg(aid).filter((x) => x.r === "A").sort((x, y) => y.c - x.c || x.e.no - y.e.no);
function medianC(list) { const v = list.map((x) => x.c).sort((p, q) => p - q), m = v.length >> 1; return v.length ? (v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2) : 0; }
function linked(aid, x, y) { return teamRelations().filter((r) => r.assemblage === aid && ((r.from === x && r.to === y) || (r.from === y && r.to === x))); }
function asmSeg() {
  if (!assemblages().find((a) => a.id === vAsm) && assemblages()[0]) vAsm = assemblages()[0].id;
  return `<div class="seg" role="group" aria-label="Assemblage">${assemblages().map((a) => `<button type="button" data-vasm="${a.id}" aria-pressed="${a.id === vAsm}">A${a.n} ${esc(a.name)}</button>`).join("")}</div>`;
}
function head(extra = "") {
  const all = withDeg(vAsm);
  const sum = ["E", "A", "B", "C", "D"].map((x) => `<span class="pill p${x}">${x} ${all.filter((y) => y.r[0] === x).length}</span>`).join(" ");
  const open = all.filter((y) => !y.r).length;
  return `<div class="controls"><div class="ctl"><span class="lab">Assemblage</span>${asmSeg()}</div>
    <div class="ctl"><span class="lab">Filter result</span><div>${sum}${open ? ` <span class="pill pQ">? ${open}</span>` : ""}</div></div>${extra}</div>`;
}
const noAsm = () => { if (!asmById(vAsm) && !assemblages()[0]) { $("#view").innerHTML = `<div class="empty">No assemblages yet. Add them in tab 0.</div>`; return true; } return false; };
const pAttr = (e, f) => `data-pid="${e.id}" data-pasm="${vAsm}" data-pf="${f}"`;

/* tab 4: filter */
function renderFilter() {
  if (noAsm()) return;
  const a = asmById(vAsm) || assemblages()[0];
  const list = withDeg(vAsm).sort((x, y) => (x.e.type === y.e.type ? x.e.no - y.e.no : x.e.type === "H" ? -1 : 1));
  const rows = list.map((x) => `<tr><td class="code">${esc(placeCode(x.e, vAsm))}</td><td>${shapeIcon(x.e.type, x.p.voice)}</td><td>${esc(x.e.name)}</td>
    <td>${x.e.type === "H" ? rpill("E") : `<select ${pAttr(x.e, "fr")} aria-label="Result, ${esc(x.e.name)}"><option value="">Not yet…</option>${RESULTS.map((r) => `<option ${r === x.r ? "selected" : ""}>${r}</option>`).join("")}</select>`}</td>
    <td class="code small">${stopAt(x.r)}</td>
    <td style="min-width:240px">${x.e.type === "H" ? `<span class="muted small">Human stakeholder. Stays as a column.</span>` : `<textarea ${pAttr(x.e, "fwhy")} rows="2" placeholder="Reason" aria-label="Reason, ${esc(x.e.name)}">${esc(x.p.fwhy || "")}</textarea>`}</td></tr>`).join("");
  $("#view").innerHTML = `<div class="card">${head()}
    <div class="ctl" style="max-width:760px;margin-bottom:16px"><label for="ivText">Problem situation</label>
      <textarea id="ivText" rows="2" placeholder="Describe the problem situation in your own words">${esc(ivOf(team))}</textarea>
      <span class="muted small">This team’s problem situation. The filter, and later the vulnerability rating, are judged in this situation.</span></div>
    <p class="muted small" style="margin:0 0 12px;max-width:900px"><b>E</b> Is it human? <b>A</b> Does it produce and maintain itself? <b>B</b> Is it what the design works on directly? A and B are asked independently. <b>C</b> If neither: does it make other entities present? <b>D</b> Otherwise: a resource used, a pressure exerted or a condition imposed. Judged by its relation to this design, not by kind. If one element plays two parts, split it in tab 1.</p>
    <div class="tablewrap"><table class="ftable"><thead><tr><th>No.</th><th></th><th>Element</th><th>Result</th><th>Stopped at</th><th>Reason</th></tr></thead>
    <tbody>${rows || `<tr><td colspan="6" class="muted">No elements in the ${esc(a.name)} map yet.</td></tr>`}</tbody></table></div></div>`;
}

/* tab 5: relational record */
function renderRecord() {
  if (noAsm()) return;
  const all = withDeg(vAsm), A = all.filter((x) => x.r === "A"), m = medianC(A);
  const mapHtml = `<div class="cmaps" style="grid-template-columns:minmax(0,1fr);max-width:640px">${centralityMaps(teamElements(), degrees(), vAsm)}</div>`;
  const dl = `<div class="card" style="margin-top:20px"><h2>Download (all teams)</h2><div style="display:flex;flex-wrap:wrap;gap:8px"><button type="button" class="btn" id="dlEl">Elements and judgements (CSV)</button><button type="button" class="btn" id="dlRel">Relations (CSV)</button></div></div>`;
  if (!A.length) { $("#view").innerHTML = `<div class="card">${head()}${mapHtml}<p class="warn">No stake-holding participant (A) in this map yet. Filter in tab 3. If none is A after filtering, check the boundary: what lies outside the theme and is affected by it?</p></div>${dl}`; return; }
  const cols = all.sort((x, y) => (x.e.type === y.e.type ? x.e.no - y.e.no : x.e.type === "H" ? -1 : 1));
  let h = `<div class="tablewrap"><table class="rec" style="table-layout:fixed;min-width:${180 + cols.length * 36 + 150}px"><thead>
    <tr><th style="width:180px;border-bottom:0"></th>${cols.map((c) => `<th style="width:36px;border-bottom:0"><div class="vh" title="${esc(c.e.name)}">${esc(elCode(c.e) + " " + c.e.name)}</div></th>`).join("")}<th class="num" style="width:76px;border-bottom:0">Degree</th><th class="num" style="width:74px;border-bottom:0">Sources</th></tr>
    <tr><th></th>${cols.map((c) => `<th style="text-align:center">${c.r ? `<span class="pill p${c.r[0]}" style="padding:1px 5px">${c.r[0]}</span>` : `<span class="pill pQ" style="padding:1px 5px">?</span>`}</th>`).join("")}<th></th><th></th></tr></thead><tbody>`;
  A.forEach((x) => {
    const src = x.p.src ?? 0, low = A.length === 1 || x.c < m;
    h += `<tr><td>${shapeIcon("N", x.p.voice)} ${esc(elCode(x.e) + " " + x.e.name)}</td>${cols.map((c) => {
      if (c.e.id === x.e.id) return `<td><span class="cell self"></span></td>`;
      const ls_ = linked(vAsm, x.e.id, c.e.id);
      const cls = !ls_.length ? "" : ls_.every((r) => r.disputed) ? "disp" : "on";
      return `<td><span class="cell ${cls}" title="${esc(x.e.name)} – ${esc(c.e.name)}${ls_.length ? ": " + esc(ls_.map((r) => r.verb).join("; ")) : ""}"></span></td>`;
    }).join("")}<td class="num"><b>${x.d}/${x.n - 1}</b><div class="muted small">${fmt(x.c)}</div></td>
    <td class="num"><input type="text" inputmode="numeric" ${pAttr(x.e, "src")} value="${src}" style="width:52px;text-align:right" aria-label="Sources, ${esc(x.e.name)}"></td></tr>`;
    if (low && src <= 1) h += `<tr><td colspan="${cols.length + 3}" class="warn" style="padding:4px 6px 10px">${esc(x.e.name)}: low degree from ${src} source${src === 1 ? "" : "s"}. Further inquiry before reading it as peripheral.</td></tr>`;
  });
  $("#view").innerHTML = `<div class="card">${head()}${mapHtml}
    <p class="muted small" style="margin:0 0 12px">Rows: A only. Columns: every element on this map, humans and background included. Filled cell: a line on the map (striped: team disagrees). Sources: how many sources evidence this participant’s relations.</p>
    ${h}</tbody></table></div><p class="muted small" style="margin:10px 0 0">Degree = lines ÷ (elements in this map − 1). Median of A: ${fmt(m)}.</p></div>${dl}`;
}

/* tab 6: vulnerability (A only) */
function renderVul() {
  if (noAsm()) return;
  const a = asmById(vAsm) || assemblages()[0];
  const list = As(vAsm), notYet = withDeg(vAsm).filter((x) => !x.r);
  const done = list.filter((x) => typeof x.p.vul?.lv === "number").length;
  const cards = list.map((x) => {
    const v = x.p.vul || {}, rated = typeof v.lv === "number";
    return `<div class="rate${rated ? "" : " todo"}">
      <div class="top">${shapeIcon("N", x.p.voice)}<span class="code muted small">${esc(placeCode(x.e, vAsm))}</span><b>${esc(x.e.name)}</b><span class="c">degree ${x.d}/${x.n - 1} · ${fmt(x.c)}</span></div>
      <div class="row"><select data-vid="${x.e.id}" data-vf="dim" aria-label="Integrity dimension, ${esc(x.e.name)}"><option value="">Integrity dimension…</option>${DIMS.map((d) => `<option ${v.dim === d ? "selected" : ""}>${esc(d)}</option>`).join("")}</select>
      <select data-vid="${x.e.id}" data-vf="p" aria-label="Process touched, ${esc(x.e.name)}"><option value="">Process touched…</option>${PROCS.map((p, i) => `<option value="${i}" ${v.p === i ? "selected" : ""}>${p}</option>`).join("")}</select>
      <select data-vid="${x.e.id}" data-vf="lv" aria-label="Vulnerability, ${esc(x.e.name)}"><option value="">Vulnerability…</option>${LEVELS.map((l, i) => `<option value="${i}" ${v.lv === i ? "selected" : ""}>${l}</option>`).join("")}</select></div>
      <textarea data-vid="${x.e.id}" data-vf="why" rows="2" placeholder="Reason and source" aria-label="Reason, ${esc(x.e.name)}">${esc(v.why || "")}</textarea></div>`;

  $("#view").innerHTML = `<div class="card">${head(`<span class="muted small">Rated ${done} / ${list.length}</span>`)}
    <div class="ctl" style="max-width:760px;margin-bottom:16px"><span class="lab">Problem situation</span><div class="ivshow">${ivOf(team) ? esc(ivOf(team)) : `<span class="muted">Not written yet. Write it in tab 3.</span>`}</div>
      <span class="muted small">Vulnerability below is rated in this situation.</span></div>
    <p class="muted small" style="margin:0 0 10px">Only stake-holding participants (A) in the ${esc(a.name)} map are rated: how far does the situation unsettle the way it keeps itself going? Listed by degree.</p>
    ${notYet.length ? `<p class="warn" style="margin:0 0 10px">Not filtered yet (tab 3): ${notYet.map((x) => esc(elCode(x.e) + " " + x.e.name)).join(", ")}</p>` : ""}
    <div class="ratelist">${cards || `<div class="empty">No A in this map yet. Filter in tab 3.</div>`}</div></div>`;
}
function saveVul(eid, field, value) {
  const e = elById(eid); if (!e) return;
  const p = e.placements[vAsm]; const v = { dim: "", lv: null, why: "", ...(p.vul || {}) };
  v[field] = field === "lv" || field === "p" ? (value === "" ? null : +value) : value;
  if (v.p === undefined) v.p = null;
  p.vul = v; // optimistic
  store.setVul(eid, vAsm, v);
}

/* tab 7: matrix (A only) */
function renderMatrix(target = $("#view")) {
  if (noAsm()) return;
  const all = As(vAsm), cs = medianC(all);
  const W2 = 600, H = 450, L = 70, T = 20, PW = W2 - L - 20, PH = H - T - 58;
  // vertical = centrality → scope of participation; horizontal = vulnerability → priority
  const X = (lv) => L + (lv + 0.5) / 4 * PW, Y = (c) => T + PH - c * PH;
  let g = `<rect x="${L}" y="${T}" width="${PW}" height="${PH}" fill="#F8F7F3" stroke="#D6D3CA"/>`;
  const sx = L + PW / 2, sy = Y(cs);
  g += `<line x1="${sx}" y1="${T}" x2="${sx}" y2="${T + PH}" stroke="#66645D" stroke-dasharray="5 4"/><line x1="${L}" y1="${sy}" x2="${L + PW}" y2="${sy}" stroke="#66645D" stroke-dasharray="5 4"/>`;
  const ql = (x, y, t, an) => `<text x="${x}" y="${y}" text-anchor="${an}" font-size="10" font-weight="700" fill="#66645D">${t}</text>`;
  g += ql(L + 8, T + 16, "LOWER PRIORITY · WHOLE PROCESS", "start") + ql(L + PW - 8, T + 16, "PRIORITY · WHOLE PROCESS", "end")
     + ql(L + 8, T + PH - 8, "LOWER PRIORITY · SPECIFIC DECISIONS", "start") + ql(L + PW - 8, T + PH - 8, "PRIORITY · SPECIFIC DECISIONS", "end");
  LEVELS.forEach((l, i) => g += `<text x="${X(i)}" y="${T + PH + 18}" text-anchor="middle" font-size="11" fill="#66645D">${l}</text>`);
  [0, .25, .5, .75, 1].forEach((t) => g += `<text x="${L - 8}" y="${Y(t) + 4}" text-anchor="end" font-size="11" fill="#66645D">${t.toFixed(2)}</text>`);
  g += `<text x="${L + PW / 2}" y="${H - 10}" text-anchor="middle" font-size="12" fill="#1F1F1C">Vulnerability → priority</text>`;
  g += `<text transform="translate(16 ${T + PH / 2}) rotate(-90)" text-anchor="middle" font-size="12" fill="#1F1F1C">Centrality → scope of participation</text>`;
  g += `<text x="${L + 4}" y="${sy - 4}" font-size="10" fill="#66645D">median ${fmt(cs)}</text>`;
  const seen = {}, unr = [], rows = [];
  all.forEach((x) => {
    const v = x.p.vul;
    if (typeof v?.lv !== "number") { unr.push(x); rows.push(`<tr><td class="code">${esc(placeCode(x.e, vAsm))}</td><td>${esc(x.e.name)}</td><td class="num">${fmt(x.c)}</td><td class="muted">not rated</td><td></td></tr>`); return; }
    const key = x.c.toFixed(3) + "|" + v.lv, j = seen[key] = (seen[key] || 0) + 1;
    const px = X(v.lv) + (j - 1) * 16, py = Y(x.c) + (j - 1) * 14, h = 9;
    g += `<path d="M${px} ${py - h} L${px + h * 1.1} ${py + h * .8} L${px - h * 1.1} ${py + h * .8} Z" fill="#FFF" stroke="${COL.N.stroke}" stroke-width="2.5" stroke-linejoin="round"/><text x="${px > L + PW * 0.65 ? px - 14 : px + 14}" text-anchor="${px > L + PW * 0.65 ? "end" : "start"}" y="${py + 4}" font-size="12" font-weight="600" fill="#1F1F1C" paint-order="stroke" stroke="#F8F7F3" stroke-width="4" stroke-linejoin="round">${esc(elCode(x.e) + " " + x.e.name)}</text>`;
    const pri = v.lv >= 2, whole = x.c >= cs;
    rows.push(`<tr><td class="code">${esc(placeCode(x.e, vAsm))}</td><td>${esc(x.e.name)}</td><td class="num">${fmt(x.c)}</td><td>${LEVELS[v.lv]}</td><td><span class="pill ${pri ? "crit" : ""}" style="white-space:normal">${pri ? "Priority" : "Lower priority"} · ${whole ? "whole process" : "specific decisions"}</span></td></tr>`);
  });
  target.innerHTML = `<div class="mgrid"><div class="card">${head()}
      <div class="ctl" style="margin-bottom:14px"><span class="lab">Problem situation</span><div class="ivshow">${ivOf(team) ? esc(ivOf(team)) : `<span class="muted">Not written yet. Write it in tab 3.</span>`}</div></div>
      ${all.length ? `<p class="muted small" style="margin:0 0 8px">Only A. No one drops off the matrix. Split line: median centrality of A${all.length === 1 ? "; with one A the split means little" : ""}.</p>
      <div class="plot"><svg viewBox="0 0 ${W2} ${H}" role="img" aria-label="Centrality–vulnerability matrix">${g}</svg></div>
      ${unr.length ? `<div class="unrated"><span class="muted small">Not rated yet · rate in tab 5</span>${unr.map((x) => `<span class="chip">${shapeIcon("N", x.p.voice, 13)}${esc(elCode(x.e) + " " + x.e.name)}</span>`).join("")}</div>` : ""}`
      : `<div class="empty">No A in this map yet. Filter in tab 3.</div>`}</div>
    <div class="card"><h2>Stake-holding participants (A)</h2><p class="muted small" style="margin:-6px 0 10px">Centrality from tab 4, vulnerability from tab 5.</p>
      <div class="tablewrap"><table><thead><tr><th>No.</th><th>Participant</th><th class="num">Centrality</th><th>Vulnerability</th><th>Reading</th></tr></thead><tbody>${rows.join("") || `<tr><td colspan="5" class="muted">None</td></tr>`}</tbody></table></div></div></div>`;
}

/* tab 8: routes */
function renderRoutes() {
  if (noAsm()) return;
  const all = withDeg(vAsm), A = all.filter((x) => x.r === "A"), B = all.filter((x) => x.r === "B"), C = all.filter((x) => x.r === "C");
  const spokes = (x) => {
    const s = new Set();
    teamRelations().filter((r) => r.assemblage === vAsm && (r.from === x.e.id || r.to === x.e.id)).forEach((r) => { const o = elById(r.from === x.e.id ? r.to : r.from); if (o?.type === "H") s.add(o.name); });
    if (x.p.voice === "spoken" && x.p.spokenBy) s.add(x.p.spokenBy);
    return [...s];
  };
  const aRows = A.map((x) => { const on = x.p.mk || [], s = spokes(x);
    return `<tr><td>${shapeIcon("N", x.p.voice)} ${esc(elCode(x.e) + " " + x.e.name)}</td>
      <td>${CONDS.map((c) => `<label class="ck"><input type="checkbox" ${pAttr(x.e, "mk")} value="${c}" ${on.includes(c) ? "checked" : ""}>${c}</label>`).join("")}</td>
      <td class="small">${s.length ? s.map(esc).join(", ") : `<span class="warn">None on the map. Nobody speaks for it here.</span>`}</td></tr>`; }).join("");
  $("#view").innerHTML = `<div class="card">${head()}<h2>Stake-holding participants (A)</h2>
    <p class="muted small" style="margin:-6px 0 12px">Conditions of makeability decide how each takes part, not whether. Humans linked to an A, or named as speaking for it, are possible spokespersons, to be confirmed.</p>
    ${A.length ? `<div class="tablewrap"><table class="ftable"><thead><tr><th>Participant</th><th>Conditions of makeability</th><th>Possible spokespersons</th></tr></thead><tbody>${aRows}</tbody></table></div>` : `<p class="muted">No A in this map yet.</p>`}</div>
  <div class="grid2b"><div class="card"><h2>Co-shaping participants (B)</h2>
    ${B.length ? B.map((x) => `<div class="rate" style="margin-bottom:10px"><div class="top"><b>${esc(elCode(x.e) + " " + x.e.name)}</b></div><textarea ${pAttr(x.e, "log")} rows="3" placeholder="Iteration log: operation, breakdown, resistance" aria-label="Iteration log, ${esc(x.e.name)}">${esc(x.p.log || "")}</textarea></div>`).join("") : `<p class="muted small">None.</p>`}</div>
  <div class="card"><h2>Mechanisms (C)</h2>
    ${C.length ? C.map((x) => `<div class="rate"><div class="top"><b>${esc(elCode(x.e) + " " + x.e.name)}</b></div><textarea ${pAttr(x.e, "note")} rows="3" placeholder="What it shows and what it leaves out" aria-label="Mechanism note, ${esc(x.e.name)}">${esc(x.p.note || "")}</textarea></div>`).join("") : `<p class="warn">None on the map. No device makes any participant present.</p>`}</div></div>`;
}

/* save a placement field (filter, sources, conditions, logs) */
function onPlaceField(t) {
  const e = elById(t.dataset.pid), aid = t.dataset.pasm, f = t.dataset.pf; if (!e?.placements?.[aid]) return;
  const p = e.placements[aid];
  let v;
  if (f === "mk") { const on = new Set(p.mk || []); t.checked ? on.add(t.value) : on.delete(t.value); v = CONDS.filter((c) => on.has(c)); }
  else if (f === "src") { const n = parseInt(t.value, 10); v = isNaN(n) || n < 0 ? 0 : n; }
  else v = t.value;
  p[f] = v; // optimistic
  store.setPlace(e.id, aid, f, v);
  if (f !== "fwhy" && f !== "log" && f !== "note") render();
}

/* ---------- events ---------- */
document.addEventListener("click", (ev) => {
  if (ev.target.id === "relOverlay") { selection = { aid: null, from: null, to: null }; relDraft = { verb: "", disputed: false }; renderMap(); return; }
  const relEl = ev.target.closest("[data-rel]");
  if (relEl && !ev.target.closest("button")) { openRelation(relEl.dataset.rel); return; }
  const el = ev.target.closest("button, [data-node]");
  if (!el) return;
  const d = el.dataset;
  if (d.tab) { tab = d.tab; ls.set("sm-tab", tab); pendingDelete = null; render(); return; }
  // setup
  if (el.id === "teamAdd") return saveW((w) => { w.teams.push({ id: "t" + (w.nextTeam || w.teams.length + 1), name: "Team " + (w.nextTeam || w.teams.length + 1) }); w.nextTeam = (w.nextTeam || w.teams.length) + 1; });
  if (d.teamDel !== undefined) return saveW((w) => w.teams.splice(+d.teamDel, 1));
  if (el.id === "asmAdd") return saveW((w) => { const n = w.nextAssemblage || (w.assemblages.length + 1); w.assemblages.push({ id: "a" + n, n, name: "New assemblage" }); w.nextAssemblage = n + 1; });
  if (d.asmDel !== undefined) return saveW((w) => w.assemblages.splice(+d.asmDel, 1));
  if (el.id === "srcAdd") return saveW((w) => w.sources.push("New source"));
  if (d.srcDel !== undefined) return saveW((w) => w.sources.splice(+d.srcDel, 1));
  // elements
  if (el.id === "formCancel") { form = newForm(); renderForm(); return; }
  if (d.edit) {
    const e = elById(d.edit); if (!e) return;
    form = { editId: e.id, name: e.name, type: e.type, checked: {}, place: {} };
    for (const aid of Object.keys(e.placements || {})) { form.checked[aid] = true; form.place[aid] = { ...blankPlace(), ...e.placements[aid] }; }
    renderForm(); $("#fName")?.focus(); window.scrollTo({ top: 0, behavior: "smooth" }); return;
  }
  if (d.del) { pendingDelete = { kind: "el", id: d.del }; renderElList(); return; }
  if (d.delNo !== undefined) { pendingDelete = null; tab === "map" ? refreshSide() : renderElList(); return; }
  if (d.delYes) {
    const id = d.delYes; pendingDelete = null;
    store.deleteDocs([id], data.relations.filter((r) => r.from === id || r.to === id).map((r) => r.id));
    if (form.editId === id) { form = newForm(); renderForm(); }
    return;
  }
  // map
  if (el.id === "relClear") { selection = { aid: null, from: null, to: null }; relDraft = { verb: "", disputed: false }; renderMap(); return; }
  if (el.id === "relSave") { saveRelation(); return; }
  if (d.relayout) { resetLayout(d.relayout); return; }
  if (el.id === "relDelete") { relDraft.confirmDel = true; renderMap(); return; }
  if (el.id === "relDelNo") { relDraft.confirmDel = false; renderMap(); return; }
  if (el.id === "relDelYes") { const id = relDraft.editId; selection = { aid: null, from: null, to: null }; relDraft = { verb: "", disputed: false }; store.deleteDocs([], [id]); renderMap(); return; }
  if (d.redit) { openRelation(d.redit); return; }
  if (d.rdel) { pendingDelete = { kind: "rel", id: d.rdel }; refreshSide(); return; }
  if (d.rdelYes) { pendingDelete = null; store.deleteDocs([], [d.rdelYes]); return; }
  if (d.rdisp) { const r = data.relations.find((x) => x.id === d.rdisp); if (r) store.updateRelation(r.id, { disputed: !r.disputed }); return; }
  if (d.vasm) { vAsm = d.vasm; ls.set("sm-vasm", vAsm); render(); return; }
  // count
  if (el.id === "dlEl") return exportElements();
  if (el.id === "dlRel") return exportRelations();
});

document.addEventListener("keydown", (ev) => {
  const n = ev.target.closest?.("[data-node]");
  if (n && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); clickNode(n.dataset.node, n.dataset.asm); }
  const rl = ev.target.closest?.("[data-rel]");
  if (rl && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); openRelation(rl.dataset.rel); }
  if (ev.target.id === "relVerb" && ev.key === "Enter") { ev.preventDefault(); saveRelation(); }
  if (ev.key === "Escape" && $("#relOverlay")) { selection = { aid: null, from: null, to: null }; relDraft = { verb: "", disputed: false }; renderMap(); }
});

document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "fName") form.name = t.value;
  else if (t.dataset.p && t.dataset.k && t.tagName === "INPUT") { (form.place[t.dataset.p] ||= blankPlace())[t.dataset.k] = t.value; }
  else if (t.id === "relVerb") { relDraft.verb = t.value; const b = $("#relSave"); if (b) b.disabled = !(selection.from && selection.to && t.value.trim()); }
});

document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.id === "teamSel") { team = t.value; ls.set("sm-team", team); selection = { aid: null, from: null, to: null }; pendingDelete = null; if (!form.editId) form = newForm(); render(); return; }
  if (t.name === "fType") { form.type = t.value; return; }
  if (t.dataset.chk) { form.checked[t.dataset.chk] = t.checked; renderForm(); return; }
  if (t.dataset.p && t.tagName === "SELECT") { (form.place[t.dataset.p] ||= blankPlace())[t.dataset.k] = t.value; renderForm(); return; }
  if (t.id === "relDisp") { relDraft.disputed = t.checked; return; }
  if (t.dataset.vid) { saveVul(t.dataset.vid, t.dataset.vf, t.value); if (t.dataset.vf !== "why") renderVul(); return; }
  if (t.dataset.pid) { onPlaceField(t); return; }
  if (t.id === "ivText") { const v = t.value.trim(); const w = structuredClone(W()); w.interventions = { ...(w.interventions || {}), [team]: v }; data.workshop = w; store.setIntervention(team, v); return; }
  if (t.id === "labelToggle") { showLabels = t.checked; ls.set("sm-labels", showLabels ? "1" : "0"); renderMap(); return; }
  // setup fields save on change
  if (t.id === "sitName") return saveW((w) => { w.situation = t.value.trim(); });
  if (t.dataset.teamName !== undefined) return saveW((w) => { w.teams[+t.dataset.teamName].name = t.value.trim() || "Team"; });
  if (t.dataset.asmName !== undefined) return saveW((w) => { w.assemblages[+t.dataset.asmName].name = t.value.trim() || "Assemblage"; });
  if (t.dataset.srcName !== undefined) return saveW((w) => { w.sources[+t.dataset.srcName] = t.value.trim() || "Source"; });
});

document.addEventListener("submit", (ev) => { if (ev.target.id === "elForm") { ev.preventDefault(); submitForm(); } });

/* dragging nodes */
let drag = null;
document.addEventListener("pointerdown", (ev) => {
  const n = ev.target.closest?.("[data-node]");
  if (!n) return;
  const svg = n.ownerSVGElement;
  drag = { id: n.dataset.node, aid: n.dataset.asm, svg, g: n, sx: ev.clientX, sy: ev.clientY, moved: false, dx: 0, dy: 0 };
  n.setPointerCapture?.(ev.pointerId);
});
document.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  const dist = Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy);
  if (!drag.moved && dist < 5) return;
  drag.moved = true; dragging = true;
  const m = drag.svg.getScreenCTM().inverse();
  const p0 = new DOMPoint(drag.sx, drag.sy).matrixTransform(m), p1 = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m);
  drag.dx = p1.x - p0.x; drag.dy = p1.y - p0.y;
  drag.g.setAttribute("transform", `translate(${drag.dx} ${drag.dy})`);
});
document.addEventListener("pointerup", () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) { clickNode(d.id, d.aid); return; }
  dragging = false;
  const e = elById(d.id); if (!e) return;
  const list = layoutDefaults(teamElements().filter((x) => x.placements?.[d.aid]).map((x) => ({ e: x, p: x.placements[d.aid] })));
  const cur = list.find((x) => x.e.id === d.id);
  const nx = Math.min(0.95, Math.max(0.05, cur.x + d.dx / VB_W)), ny = Math.min(0.93, Math.max(0.06, cur.y + d.dy / VB_H));
  e.placements[d.aid].x = nx; e.placements[d.aid].y = ny; // optimistic
  renderMap();
  store.setPosition(d.id, d.aid, nx, ny);
});

/* ---------- start ---------- */
(async function start() {
  render();
  $("#view").innerHTML = `<div class="empty">Loading…</div>`;
  try {
    store = DEMO ? makeDemoStore() : await makeFirebaseStore();
  } catch (e) {
    console.error(e);
    showBanner("The database library did not load. Check the internet connection and reload. To try the page without a database, add <code>?demo</code> to the address.", true);
    return;
  }
  if (DEMO) showBanner("Demo mode: example data (xAI Colossus, Memphis, simplified from news reports), nothing is saved. Remove <code>?demo</code> from the address to use the real workshop.");
  store.subscribe((snap) => {
    data = snap;
    if (dragging) return;
    // keep typing intact on tab 1: only refresh the list
    if (tab === "elements" && $("#elForm")) { renderChrome(); renderElList(); return; }
    if (tab === "setup" && document.activeElement && document.activeElement.closest("#view") && document.activeElement.tagName === "INPUT") return;
    if (tab === "map" && document.activeElement?.id === "relVerb") { refreshMapKeepVerb(); return; }
    if (["vul", "filter", "record", "routes"].includes(tab) && document.activeElement && document.activeElement.closest("#view") && /TEXTAREA|SELECT|INPUT/.test(document.activeElement.tagName) && document.activeElement.type !== "checkbox") return;
    render();
  });
})();
function refreshMapKeepVerb() {
  const v = $("#relVerb"); const pos = v ? v.selectionStart : null;
  renderMap();
  const nv = $("#relVerb"); if (nv) { nv.focus(); if (pos !== null) nv.setSelectionRange(pos, pos); }
}
</script>
