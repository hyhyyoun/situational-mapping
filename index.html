<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Situational Mapping</title>
<style>
:root {
  --bg: #F6F5F1;
  --panel: #FFFFFF;
  --ink: #1F1F1C;
  --muted: #66645D;
  --line: #D6D3CA;
  --soft: #EEECE6;
  --accent: #2F5FD0;
  --accent-soft: #E6ECFA;
  --danger: #B23A2E;
  --font: system-ui, -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding: 12px 24px; max-width: 1400px; margin: 0 auto; }
.brand { font-weight: 700; font-size: 16px; margin-right: auto; }
.brand small { font-weight: 400; color: var(--muted); margin-left: 8px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button { padding: 8px 14px; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; }
nav button[aria-current="page"] { background: var(--ink); color: #FFF; border-color: var(--ink); }
.teampick { display: flex; align-items: center; gap: 8px; }
select, input[type="text"] { padding: 8px 10px; border: 1px solid #B9B6AC; border-radius: 6px; background: #FFF; }
input[type="text"]:disabled { background: var(--soft); color: var(--muted); }

main { max-width: 1400px; margin: 0 auto; padding: 20px 24px 48px; }
.banner { margin-bottom: 16px; padding: 10px 14px; border-radius: 6px; background: #FFF4D6; border: 1px solid #E6CF85; }
.banner.err { background: #FBE7E4; border-color: #E2A59D; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px; }
h2 { font-size: 16px; margin: 0 0 12px; }
h3 { font-size: 13px; margin: 0; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.btn { padding: 9px 14px; border: 1px solid var(--ink); background: var(--panel); border-radius: 6px; }
.btn.primary { background: var(--ink); color: #FFF; }
.btn.ghost { border-color: var(--line); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.linkbtn { border: 0; background: none; padding: 2px 4px; color: var(--accent); text-decoration: underline; }
.linkbtn.danger { color: var(--danger); }

.grid2 { display: grid; grid-template-columns: minmax(320px, 420px) minmax(0, 1fr); gap: 20px; align-items: start; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; align-items: start; }
@media (max-width: 900px) { .grid2, .grid3 { grid-template-columns: minmax(0, 1fr); } }
.countgrid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 1000px) { .countgrid { grid-template-columns: minmax(0, 1fr); } }

.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field > .label { font-weight: 600; }
.opts { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.opts label { display: flex; align-items: center; gap: 6px; }
.place { border: 1px solid var(--line); background: var(--soft); border-radius: 6px; padding: 12px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
.place .row { display: flex; gap: 8px; }
.place .row > select { width: 160px; flex: none; }
.place .row > input { flex: 1; min-width: 0; }
.formbtns { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 6px; }

.tablewrap { overflow-x: auto; }
.eltable .actm { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); border-bottom: 2px solid var(--ink); white-space: nowrap; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.group td { background: var(--soft); font-weight: 600; font-size: 12px; letter-spacing: .03em; color: var(--muted); }
tr.cont td { border-top: 0; }
td.code { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar-cell span { display: block; height: 10px; background: var(--ink); border-radius: 2px; }

.maps { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; }
.mapcard { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.mapcard .head { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.mapcard svg { display: block; width: 100%; height: auto; touch-action: none; user-select: none; }
.node { cursor: grab; }
.rlab { cursor: pointer; }
.rlab:hover line:last-of-type { stroke: #2F5FD0; }
.node:active { cursor: grabbing; }
.outside { margin-top: 14px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: 8px; background: var(--soft); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 12px; color: var(--muted); font-size: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.maplayout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 1000px) { .maplayout { grid-template-columns: minmax(0, 1fr); } }
.side { display: flex; flex-direction: column; gap: 16px; position: sticky; top: 80px; }
.sel { display: flex; flex-direction: column; gap: 2px; margin-bottom: 10px; }
.sel b { font-weight: 600; }
.rellist { display: flex; flex-direction: column; }
.rel { display: flex; gap: 8px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); }
.rel .n { width: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.rel .t { flex: 1; min-width: 0; }

.maptools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; margin-bottom: 12px; }
.hint { color: var(--muted); }
.hint.on { color: var(--accent); font-weight: 600; }
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 38px; height: 22px; border-radius: 11px; background: #C9C6BD; position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #FFF; transition: transform .15s; }
.switch input:checked + .track { background: var(--accent); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(31,31,28,.35); display: flex; align-items: center; justify-content: center; padding: 16px; }
.pop { background: var(--panel); border-radius: 10px; padding: 20px; width: min(420px, 100%); box-shadow: 0 10px 40px rgba(0,0,0,.2); }
.pair { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 14px; padding: 10px 12px; background: var(--soft); border-radius: 6px; }
@media (prefers-reduced-motion: reduce) { .switch .track, .switch .track::after { transition: none; } }
.kv { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
.kv b { font-variant-numeric: tabular-nums; text-align: right; }
.listed { display: flex; flex-direction: column; gap: 8px; }
.listed .item { display: flex; gap: 8px; align-items: center; }
.listed .item input { flex: 1; min-width: 0; }
.tag { display: inline-block; padding: 1px 6px; border: 1px solid #B9B6AC; border-radius: 4px; font-size: 12px; font-weight: 700; }
.confirm { display: inline-flex; gap: 6px; align-items: center; }
.empty { padding: 24px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 8px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">Situational Mapping<small id="situationName"></small></div>
    <nav id="tabs" aria-label="Steps"></nav>
    <div class="teampick"><label for="teamSel">Team</label><select id="teamSel"></select></div>
  </div>
</header>
<main>
  <div id="banner"></div>
  <section id="view"></section>
</main>

<script type="module">
/* ---------- configuration ---------- */
const firebaseConfig = {
  apiKey: "AIzaSyCadpcu_ERQFBJVsxObSfXTA7bQ7m_evaM",
  authDomain: "mthd-situational-mapping.firebaseapp.com",
  projectId: "mthd-situational-mapping",
  storageBucket: "mthd-situational-mapping.firebasestorage.app",
  messagingSenderId: "281019003256",
  appId: "1:281019003256:web:f39b2e2bc3ecce628e588d"
};
const FIREBASE_VERSION = "10.12.2";

const params = new URLSearchParams(location.search);
const DEMO = params.has("demo");
// Facilitator key is checked by hash so the key itself is not in the source
const cyrb53 = (str, seed = 0) => { let h1 = 0xdeadbeef ^ seed, h2 = 0x41c6ce57 ^ seed; for (let i = 0; i < str.length; i++) { const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507); h1 ^= Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507); h2 ^= Math.imul(h1 ^ (h1 >>> 13), 3266489909); return 4294967296 * (2097151 & h2) + (h1 >>> 0); };
const ADMIN_HASH = 1859433195761764;
const ADMIN = cyrb53(params.get("key") || "") === ADMIN_HASH;
const WID = (params.get("w") || "main").replace(/[^A-Za-z0-9_-]/g, "") || "main";

const DEFAULT_WORKSHOP = {
  situation: "AI data centre siting",
  teams: [{ id: "t1", name: "Team 1" }, { id: "t2", name: "Team 2" }, { id: "t3", name: "Team 3" }],
  assemblages: [{ id: "a1", n: 1, name: "Supporting" }, { id: "a2", n: 2, name: "Opposing" }],
  nextAssemblage: 3,
  nextTeam: 4,
  sources: ["Interview", "Field observation", "News article", "Policy document", "Team knowledge"]
};
const NONE = "a0";
const VOICES = [
  { v: "speaks", label: "Speaks for itself" },
  { v: "spoken", label: "Spoken for by…" },
  { v: "silent", label: "No one speaks" }
];

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
function showBanner(msg, err) { $("#banner").innerHTML = msg ? `<div class="banner${err ? " err" : ""}">${msg}</div>` : ""; }

/* ---------- data layer ---------- */
let store;
function makeDemoStore() {
  const s = { workshop: structuredClone(DEFAULT_WORKSHOP), elements: {}, relations: {} };
  const listeners = [];
  const emit = () => listeners.forEach((f) => f(snapshot()));
  const snapshot = () => ({ workshop: s.workshop, elements: Object.entries(s.elements).map(([id, d]) => ({ id, ...d })), relations: Object.entries(s.relations).map(([id, d]) => ({ id, ...d })) });
  const P = (o) => Promise.resolve(o);
  // example data for the demo only
  const ex = [
    ["H", 1, "Residents’ committee", { a2: { voice: "speaks", source: "Interview", where: "Interview 1" } }],
    ["H", 2, "Data centre operator", { a1: { voice: "speaks", source: "News article", where: "Local news, 3 Oct" } }],
    ["H", 3, "Future generations", { a2: { voice: "silent", source: "Team knowledge" } }],
    ["N", 1, "Water", { a1: { voice: "silent", source: "Policy document", where: "Siting plan p.12" }, a2: { voice: "spoken", spokenBy: "Environmental group", source: "Interview", where: "Interview 3" } }],
    ["N", 2, "Transmission tower", { a2: { voice: "spoken", spokenBy: "Residents", source: "Field observation" } }],
    ["N", 3, "River ecosystem", { a0: { voice: "silent", source: "Team knowledge" } }]
  ];
  const ids = {};
  ex.forEach(([type, no, name, placements], i) => { const id = "e" + i; ids[type + no] = id; s.elements[id] = { team: "t1", type, no, name, placements, createdAt: i }; });
  s.relations.r1 = { team: "t1", assemblage: "a2", from: ids.H1, to: ids.N2, verb: "suffers noise from", disputed: false, no: 1, createdAt: 1 };
  s.relations.r2 = { team: "t1", assemblage: "a2", from: ids.N2, to: ids.N1, verb: "runs over", disputed: false, no: 2, createdAt: 2 };
  s.relations.r3 = { team: "t1", assemblage: "a1", from: ids.H2, to: ids.N1, verb: "cools servers with", disputed: false, no: 3, createdAt: 3 };
  return {
    subscribe(cb) { listeners.push(cb); setTimeout(() => cb(snapshot()), 0); },
    saveWorkshop(w) { s.workshop = structuredClone(w); emit(); return P(); },
    addElement(d) { const id = uid(); s.elements[id] = { ...d, createdAt: Date.now() }; emit(); return P(id); },
    updateElement(id, d) { s.elements[id] = { ...s.elements[id], ...d }; emit(); return P(); },
    setPosition(id, aid, x, y) { const p = s.elements[id]?.placements?.[aid]; if (p) { p.x = x; p.y = y; } emit(); return P(); },
    deleteDocs(elementIds, relationIds) { elementIds.forEach((i) => delete s.elements[i]); relationIds.forEach((i) => delete s.relations[i]); emit(); return P(); },
    addRelation(d) { s.relations[uid()] = { ...d, createdAt: Date.now() }; emit(); return P(); },
    updateRelation(id, d) { s.relations[id] = { ...s.relations[id], ...d }; emit(); return P(); }
  };
}

async function makeFirebaseStore() {
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}/`;
  const { initializeApp } = await import(base + "firebase-app.js");
  const fs = await import(base + "firebase-firestore.js");
  const app = initializeApp(firebaseConfig);
  const db = fs.getFirestore(app);
  const wRef = fs.doc(db, "workshops", WID);
  const eCol = fs.collection(db, "workshops", WID, "elements");
  const rCol = fs.collection(db, "workshops", WID, "relations");
  const state = { workshop: null, elements: [], relations: [] };
  let ready = { w: false, e: false, r: false };
  const onErr = (e) => { console.error(e); showBanner("Could not reach the database. Check the internet connection and the Firestore rules, then reload. (" + esc(e.code || e.message) + ")", true); };
  return {
    subscribe(cb) {
      const fire = () => { if (ready.w && ready.e && ready.r) cb({ ...state }); };
      fs.onSnapshot(wRef, (snap) => {
        if (!snap.exists()) { fs.setDoc(wRef, DEFAULT_WORKSHOP).catch(onErr); return; }
        state.workshop = snap.data(); ready.w = true; fire();
      }, onErr);
      fs.onSnapshot(eCol, (snap) => { state.elements = snap.docs.map((d) => ({ id: d.id, ...d.data() })); ready.e = true; fire(); }, onErr);
      fs.onSnapshot(rCol, (snap) => { state.relations = snap.docs.map((d) => ({ id: d.id, ...d.data() })); ready.r = true; fire(); }, onErr);
    },
    saveWorkshop(w) { return fs.setDoc(wRef, w).catch(onErr); },
    async addElement(d) { const ref = await fs.addDoc(eCol, { ...d, createdAt: fs.serverTimestamp() }).catch(onErr); return ref?.id; },
    updateElement(id, d) { return fs.updateDoc(fs.doc(eCol, id), d).catch(onErr); },
    setPosition(id, aid, x, y) { return fs.updateDoc(fs.doc(eCol, id), new fs.FieldPath("placements", aid, "x"), x, new fs.FieldPath("placements", aid, "y"), y).catch(onErr); },
    deleteDocs(elementIds, relationIds) {
      const b = fs.writeBatch(db);
      elementIds.forEach((i) => b.delete(fs.doc(eCol, i)));
      relationIds.forEach((i) => b.delete(fs.doc(rCol, i)));
      return b.commit().catch(onErr);
    },
    addRelation(d) { return fs.addDoc(rCol, { ...d, createdAt: fs.serverTimestamp() }).catch(onErr); },
    updateRelation(id, d) { return fs.updateDoc(fs.doc(rCol, id), d).catch(onErr); }
  };
}

/* ---------- app state ---------- */
let data = { workshop: null, elements: [], relations: [] };
let tab = ls.get("sm-tab", "elements");
if (tab === "setup" && !ADMIN) tab = "elements";
let team = ls.get("sm-team", "t1");
let dragging = false;
let selection = { aid: null, from: null, to: null };
let relDraft = { verb: "", disputed: false };
let showLabels = ls.get("sm-labels", "1") === "1";
let pendingDelete = null; // {kind, id}

const W = () => data.workshop || DEFAULT_WORKSHOP;
const assemblages = () => W().assemblages || [];
const asmById = (id) => id === NONE ? { id: NONE, n: 0, name: "Not in any assemblage" } : assemblages().find((a) => a.id === id);
const asmCode = (id) => "A" + (asmById(id)?.n ?? "?");
const teamElements = () => data.elements.filter((e) => e.team === team).sort((a, b) => (a.type === b.type ? a.no - b.no : a.type === "H" ? -1 : 1));
const teamRelations = () => data.relations.filter((r) => r.team === team).sort((a, b) => a.no - b.no);
const elCode = (e) => e.type + e.no;
const placeCode = (e, aid) => `${elCode(e)}·${asmCode(aid)}`;
const elById = (id) => data.elements.find((e) => e.id === id);
const orderedPlacements = (e) => Object.keys(e.placements || {}).sort((a, b) => (asmById(a)?.n ?? 99) - (asmById(b)?.n ?? 99));

/* ---------- form state for tab 1 ---------- */
function blankPlace() { return { voice: "speaks", spokenBy: "", source: W().sources?.[0] || "", sourceOther: "", where: "" }; }
let form = newForm();
function newForm() { return { editId: null, name: "", type: "N", checked: {}, place: {} }; }

/* ---------- rendering ---------- */
function renderChrome() {
  $("#situationName").textContent = W().situation ? "· " + W().situation : "";
  const tabs = [...(ADMIN ? [["setup", "0 Setup"]] : []), ["elements", "1 Elements"], ["map", "2 Map"], ["count", "3 Connections"]];
  $("#tabs").innerHTML = tabs.map(([k, l]) => `<button type="button" data-tab="${k}" ${k === tab ? 'aria-current="page"' : ""}>${l}</button>`).join("");
  const teams = W().teams || [];
  if (!teams.find((t) => t.id === team) && teams[0]) { team = teams[0].id; }
  $("#teamSel").innerHTML = teams.map((t) => `<option value="${esc(t.id)}" ${t.id === team ? "selected" : ""}>${esc(t.name)}</option>`).join("");
  $(".teampick").hidden = tab === "setup";
}

function render() {
  renderChrome();
  if (tab === "setup") renderSetup();
  else if (tab === "elements") renderElements();
  else if (tab === "map") renderMap();
  else renderCount();
}

/* shapes */
const COL = { H: { stroke: "#C8571E", fill: "#FBE3D5" }, N: { stroke: "#1E8556", fill: "#D8F0E2" } };
function shapeIcon(type, voice, size = 16) {
  const c = COL[type === "H" ? "H" : "N"], silent = voice === "silent";
  const dash = silent ? ' stroke-dasharray="3 2"' : "", fill = "#FFFFFF";
  if (type === "H") return `<svg aria-hidden="true" width="${size}" height="${size}" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.5" fill="${fill}" stroke="${c.stroke}" stroke-width="2"${dash}/></svg>`;
  return `<svg aria-hidden="true" width="${size + 2}" height="${size}" viewBox="0 0 18 16"><path d="M9 1.5 L16.5 14.5 L1.5 14.5 Z" fill="${fill}" stroke="${c.stroke}" stroke-width="2"${dash}/></svg>`;
}
const voiceText = (p) => p.voice === "speaks" ? "Speaks" : p.voice === "silent" ? "Silent" : "Spoken for by " + (p.spokenBy || "…");
const sourceText = (p) => p.source === "__other" ? (p.sourceOther || "Other") : p.source;

/* ----- tab 0: setup ----- */
function renderSetup() {
  const w = W();
  const usedAsm = new Set(data.elements.flatMap((e) => Object.keys(e.placements || {})));
  const usedTeam = new Set(data.elements.map((e) => e.team));
  $("#view").innerHTML = `
  <div class="grid3">
    <div class="card">
      <h2>Situation</h2>
      <div class="field"><label class="label" for="sitName">Situation name</label><input id="sitName" type="text" value="${esc(w.situation)}"></div>
      <h2 style="margin-top:18px">Teams</h2>
      <div class="listed">
        ${(w.teams || []).map((t, i) => `<div class="item"><input type="text" aria-label="Team name" data-team-name="${i}" value="${esc(t.name)}">${usedTeam.has(t.id) ? `<span class="muted small">has data</span>` : `<button type="button" class="linkbtn danger" data-team-del="${i}">Remove</button>`}</div>`).join("")}
      </div>
      <p><button type="button" class="btn ghost" id="teamAdd">+ Add team</button></p>
    </div>
    <div class="card">
      <h2>Stakeholder assemblages</h2>
      <p class="muted">Each assemblage becomes its own map in tab 2. Numbers (A1, A2) never change, even if you rename one.</p>
      <div class="listed">
        ${assemblages().map((a, i) => `<div class="item"><span class="tag">A${a.n}</span><input type="text" aria-label="Assemblage name" data-asm-name="${i}" value="${esc(a.name)}">${usedAsm.has(a.id) ? `<span class="muted small">has data</span>` : `<button type="button" class="linkbtn danger" data-asm-del="${i}">Remove</button>`}</div>`).join("")}
        <div class="item muted"><span class="tag">A0</span><span>Not in any assemblage (always there)</span></div>
      </div>
      <p><button type="button" class="btn ghost" id="asmAdd">+ Add assemblage</button></p>
    </div>
    <div class="card">
      <h2>Source types</h2>
      <p class="muted">Options in the source dropdown. “Other” is always added.</p>
      <div class="listed">

const VB_W = 600, VB_H = 480, S = 34;

  }).join("");
  const outside = els.filter((e) => e.placements?.[NONE]);
  const outRows = outside.length ? `<tr class="group"><td colspan="6">NOT IN ANY ASSEMBLAGE · A0 · NOT COUNTED</td></tr>` + outside.map((e) => `<tr class="muted"><td class="code">${esc(placeCode(e, NONE))}</td><td>${shapeIcon(e.type, e.placements[NONE].voice, 16, "#66645D")}</td><td>${esc(e.name)}</td><td class="num">–</td><td class="num">–</td><td></td></tr>`).join("") : "";
  $("#view").innerHTML = `<div class="countgrid">
    <div class="card"><h2>${esc(tname)} · connections per element <span class="muted" style="font-weight:400">(counted inside each assemblage)</span></h2>
      <div class="tablewrap"><table><thead><tr><th>No.</th><th></th><th>Element</th><th class="num">Normalized degree centrality</th><th class="num">Lines</th><th></th></tr></thead><tbody>${sections}${outRows}</tbody></table></div>
      <p class="muted small">Normalized degree centrality = lines ÷ (elements in that map − 1), from 0 to 1. Counted inside each assemblage’s map. Dashed lines are counted.</p></div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card"><h2>Most connected</h2>${tops.join("") || `<p class="muted">No elements yet.</p>`}</div>
      <div class="card"><h2>Summary</h2>
        <div class="kv"><span>Elements</span><b>${els.length}</b></div>
        ${assemblages().map((a) => `<div class="kv"><span>A${a.n} elements · lines</span><b>${els.filter((e) => e.placements?.[a.id]).length} · ${rels.filter((r) => r.assemblage === a.id).length}</b></div>`).join("")}
        <div class="kv"><span>Not in any assemblage</span><b>${outside.length}</b></div></div>
      <div class="card"><h2>No lines yet</h2>${noLines.length ? noLines.map((t) => `<div>${esc(t)}</div>`).join("") : `<p class="muted" style="margin:0">Every element on a map has at least one line.</p>`}</div>
      <div class="card"><h2>Download (all teams)</h2>
        <div style="display:flex;flex-direction:column;gap:8px"><button type="button" class="btn" id="dlEl">Elements and counts (CSV)</button><button type="button" class="btn" id="dlRel">Relations (CSV)</button></div></div>
    </div></div>`;
}
function csv(rows) { return "﻿" + rows.map((r) => r.map((v) => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\n"); }
function download(name, text) {
  const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function exportElements() {
  const teamName = (id) => (W().teams || []).find((t) => t.id === id)?.name || id;
  const rows = [["workshop", "team", "element_id", "placement_code", "element_code", "type", "name", "assemblage_code", "assemblage_name", "voice", "spoken_by", "source", "where", "degree_in_assemblage", "elements_in_assemblage", "degree_centrality_normalized"]];
  const saveTeam = team;
  for (const t of (W().teams || [])) {
    team = t.id; const deg = degrees(); const tEls = teamElements(); const nOn = (aid) => tEls.filter((e) => e.placements?.[aid]).length;
    for (const e of teamElements()) for (const aid of orderedPlacements(e)) {
      const p = e.placements[aid];
      rows.push([WID, teamName(t.id), e.id, placeCode(e, aid), elCode(e), e.type === "H" ? "human" : "nonhuman", e.name, asmCode(aid), asmById(aid)?.name, p.voice, p.spokenBy, sourceText(p), p.where, aid === NONE ? "" : (deg[e.id + "|" + aid] || 0), aid === NONE ? "" : nOn(aid), aid === NONE ? "" : normDeg(deg[e.id + "|" + aid] || 0, nOn(aid)).toFixed(3)]);
    }
  }
  team = saveTeam;
  download(`situational-mapping-elements-${WID}.csv`, csv(rows));
}
function exportRelations() {
  const teamName = (id) => (W().teams || []).find((t) => t.id === id)?.name || id;
  const rows = [["workshop", "team", "line_no", "assemblage_code", "assemblage_name", "from_code", "from_name", "relation", "to_code", "to_name", "disputed"]];
  for (const r of [...data.relations].sort((a, b) => (a.team + a.no).localeCompare(b.team + b.no, undefined, { numeric: true }))) {
    const f = elById(r.from), t = elById(r.to);
    rows.push([WID, teamName(r.team), r.no, asmCode(r.assemblage), asmById(r.assemblage)?.name, f ? placeCode(f, r.assemblage) : "", f?.name, r.verb, t ? placeCode(t, r.assemblage) : "", t?.name, r.disputed ? "yes" : "no"]);
  }
  download(`situational-mapping-relations-${WID}.csv`, csv(rows));
}

/* ---------- events ---------- */
document.addEventListener("click", (ev) => {
  if (ev.target.id === "relOverlay") { selection = { aid: null, from: null, to: null }; relDraft = { verb: "", disputed: false }; renderMap(); return; }
  const relEl = ev.target.closest("[data-rel]");
  if (relEl && !ev.target.closest("button")) { openRelation(relEl.dataset.rel); return; }
  const el = ev.target.closest("button, [data-node]");
  if (!el) return;
  const d = el.dataset;
  if (d.tab) { tab = d.tab; ls.set("sm-tab", tab); pendingDelete = null; render(); return; }
  // setup
  if (el.id === "teamAdd") return saveW((w) => { w.teams.push({ id: "t" + (w.nextTeam || w.teams.length + 1), name: "Team " + (w.nextTeam || w.teams.length + 1) }); w.nextTeam = (w.nextTeam || w.teams.length) + 1; });
  if (d.teamDel !== undefined) return saveW((w) => w.teams.splice(+d.teamDel, 1));
  if (el.id === "asmAdd") return saveW((w) => { const n = w.nextAssemblage || (w.assemblages.length + 1); w.assemblages.push({ id: "a" + n, n, name: "New assemblage" }); w.nextAssemblage = n + 1; });
  if (d.asmDel !== undefined) return saveW((w) => w.assemblages.splice(+d.asmDel, 1));
  if (el.id === "srcAdd") return saveW((w) => w.sources.push("New source"));
  if (d.srcDel !== undefined) return saveW((w) => w.sources.splice(+d.srcDel, 1));
  // elements
  if (el.id === "formCancel") { form = newForm(); renderForm(); return; }
  if (d.edit) {
    const e = elById(d.edit); if (!e) return;
    form = { editId: e.id, name: e.name, type: e.type, checked: {}, place: {} };
    for (const aid of Object.keys(e.placements || {})) { form.checked[aid] = true; form.place[aid] = { ...blankPlace(), ...e.placements[aid] }; }
    renderForm(); $("#fName")?.focus(); window.scrollTo({ top: 0, behavior: "smooth" }); return;
  }
  if (d.del) { pendingDelete = { kind: "el", id: d.del }; renderElList(); return; }
  if (d.delNo !== undefined) { pendingDelete = null; tab === "map" ? refreshSide() : renderElList(); return; }
  if (d.delYes) {
    const id = d.delYes; pendingDelete = null;
    store.deleteDocs([id], data.relations.filter((r) => r.from === id || r.to === id).map((r) => r.id));
    if (form.editId === id) { form = newForm(); renderForm(); }
    return;
  }
  // map
  if (el.id === "relClear") { selection = { aid: null, from: null, to: null }; relDraft = { verb: "", disputed: false }; renderMap(); return; }
  if (el.id === "relSave") { saveRelation(); return; }
  if (d.relayout) { resetLayout(d.relayout); return; }
  if (el.id === "relDelete") { relDraft.confirmDel = true; renderMap(); return; }
  if (el.id === "relDelNo") { relDraft.confirmDel = false; renderMap(); return; }
  if (el.id === "relDelYes") { const id = relDraft.editId; selection = { aid: null, from: null, to: null }; relDraft = { verb: "", disputed: false }; store.deleteDocs([], [id]); renderMap(); return; }
  if (d.redit) { openRelation(d.redit); return; }
  if (d.rdel) { pendingDelete = { kind: "rel", id: d.rdel }; refreshSide(); return; }
  if (d.rdelYes) { pendingDelete = null; store.deleteDocs([], [d.rdelYes]); return; }
  if (d.rdisp) { const r = data.relations.find((x) => x.id === d.rdisp); if (r) store.updateRelation(r.id, { disputed: !r.disputed }); return; }
  // count
  if (el.id === "dlEl") return exportElements();
  if (el.id === "dlRel") return exportRelations();
});

document.addEventListener("keydown", (ev) => {
  const n = ev.target.closest?.("[data-node]");
  if (n && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); clickNode(n.dataset.node, n.dataset.asm); }
  const rl = ev.target.closest?.("[data-rel]");
  if (rl && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); openRelation(rl.dataset.rel); }
  if (ev.target.id === "relVerb" && ev.key === "Enter") { ev.preventDefault(); saveRelation(); }
  if (ev.key === "Escape" && $("#relOverlay")) { selection = { aid: null, from: null, to: null }; relDraft = { verb: "", disputed: false }; renderMap(); }
});

document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "fName") form.name = t.value;
  else if (t.dataset.p && t.dataset.k && t.tagName === "INPUT") { (form.place[t.dataset.p] ||= blankPlace())[t.dataset.k] = t.value; }
  else if (t.id === "relVerb") { relDraft.verb = t.value; const b = $("#relSave"); if (b) b.disabled = !(selection.from && selection.to && t.value.trim()); }
});

document.addEventListener("change", (ev) => {
  const t = ev.target;
  if (t.id === "teamSel") { team = t.value; ls.set("sm-team", team); selection = { aid: null, from: null, to: null }; pendingDelete = null; if (!form.editId) form = newForm(); render(); return; }
  if (t.name === "fType") { form.type = t.value; return; }
  if (t.dataset.chk) { form.checked[t.dataset.chk] = t.checked; renderForm(); return; }
  if (t.dataset.p && t.tagName === "SELECT") { (form.place[t.dataset.p] ||= blankPlace())[t.dataset.k] = t.value; renderForm(); return; }
  if (t.id === "relDisp") { relDraft.disputed = t.checked; return; }
  if (t.id === "labelToggle") { showLabels = t.checked; ls.set("sm-labels", showLabels ? "1" : "0"); renderMap(); return; }
  // setup fields save on change
  if (t.id === "sitName") return saveW((w) => { w.situation = t.value.trim(); });
  if (t.dataset.teamName !== undefined) return saveW((w) => { w.teams[+t.dataset.teamName].name = t.value.trim() || "Team"; });
  if (t.dataset.asmName !== undefined) return saveW((w) => { w.assemblages[+t.dataset.asmName].name = t.value.trim() || "Assemblage"; });
  if (t.dataset.srcName !== undefined) return saveW((w) => { w.sources[+t.dataset.srcName] = t.value.trim() || "Source"; });
});

document.addEventListener("submit", (ev) => { if (ev.target.id === "elForm") { ev.preventDefault(); submitForm(); } });

/* dragging nodes */
let drag = null;
document.addEventListener("pointerdown", (ev) => {
  const n = ev.target.closest?.("[data-node]");
  if (!n) return;
  const svg = n.ownerSVGElement;
  drag = { id: n.dataset.node, aid: n.dataset.asm, svg, g: n, sx: ev.clientX, sy: ev.clientY, moved: false, dx: 0, dy: 0 };
  n.setPointerCapture?.(ev.pointerId);
});
document.addEventListener("pointermove", (ev) => {
  if (!drag) return;
  const dist = Math.hypot(ev.clientX - drag.sx, ev.clientY - drag.sy);
  if (!drag.moved && dist < 5) return;
  drag.moved = true; dragging = true;
  const m = drag.svg.getScreenCTM().inverse();
  const p0 = new DOMPoint(drag.sx, drag.sy).matrixTransform(m), p1 = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(m);
  drag.dx = p1.x - p0.x; drag.dy = p1.y - p0.y;
  drag.g.setAttribute("transform", `translate(${drag.dx} ${drag.dy})`);
});
document.addEventListener("pointerup", () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (!d.moved) { clickNode(d.id, d.aid); return; }
  dragging = false;
  const e = elById(d.id); if (!e) return;
  const list = layoutDefaults(teamElements().filter((x) => x.placements?.[d.aid]).map((x) => ({ e: x, p: x.placements[d.aid] })));
  const cur = list.find((x) => x.e.id === d.id);
  const nx = Math.min(0.95, Math.max(0.05, cur.x + d.dx / VB_W)), ny = Math.min(0.93, Math.max(0.06, cur.y + d.dy / VB_H));
  e.placements[d.aid].x = nx; e.placements[d.aid].y = ny; // optimistic
  renderMap();
  store.setPosition(d.id, d.aid, nx, ny);
});

/* ---------- start ---------- */
(async function start() {
  render();
  $("#view").innerHTML = `<div class="empty">Loading…</div>`;
  try {
    store = DEMO ? makeDemoStore() : await makeFirebaseStore();
  } catch (e) {
    console.error(e);
    showBanner("The database library did not load. Check the internet connection and reload. To try the page without a database, add <code>?demo</code> to the address.", true);
    return;
  }
  if (DEMO) showBanner("Demo mode: example data, nothing is saved. Remove <code>?demo</code> from the address to use the real workshop.");
  store.subscribe((snap) => {
    data = snap;
    if (dragging) return;
    // keep typing intact on tab 1: only refresh the list
    if (tab === "elements" && $("#elForm")) { renderChrome(); renderElList(); return; }
    if (tab === "setup" && document.activeElement && document.activeElement.closest("#view") && document.activeElement.tagName === "INPUT") return;
    if (tab === "map" && document.activeElement?.id === "relVerb") { refreshMapKeepVerb(); return; }
    render();
  });
})();
function refreshMapKeepVerb() {
  const v = $("#relVerb"); const pos = v ? v.selectionStart : null;
  renderMap();
  const nv = $("#relVerb"); if (nv) { nv.focus(); if (pos !== null) nv.setSelectionRange(pos, pos); }
}
</script>
</body>
